# Tareas automáticas del Game Over FC (horas en UTC: Madrid = UTC+1 en invierno, UTC+2 en verano)
name: Tareas automáticas

on:
  schedule:
    - cron: "17 * * * *"          # cada hora: avisos pendientes (hora del partido, Fantasy, fotos)
    - cron: "*/5 * * * *"         # cada 5 min: notificaciones que manda el admin desde la app
    - cron: "*/15 7-21 * * 3"     # los miércoles cada 15 min: detectar la hora del partido cuanto antes
    - cron: "0 8 * * 2"           # martes 10:00 Madrid en verano (UTC+2): encuesta del entreno
    - cron: "0 9 * * 2"           # martes 10:00 Madrid en invierno (UTC+1): encuesta del entreno
  workflow_dispatch:
    inputs:
      tarea:
        description: "Qué ejecutar"
        type: choice
        options: [sync, entreno, inicializar, cargar-partidos, cargar-clasificacion, publicar-reglas, ajustes-entreno, migrar, avisos, prueba-notificacion]
        default: sync

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r requirements.txt

      - name: Elegir tarea
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "tarea=${{ inputs.tarea }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "*/5 * * * *" ]; then echo "tarea=avisos" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "0 9 * * 2" ] || [ "${{ github.event.schedule }}" = "0 8 * * 2" ]; then echo "tarea=entreno" >> "$GITHUB_OUTPUT";
          else echo "tarea=sync" >> "$GITHUB_OUTPUT"; fi

      - if: steps.t.outputs.tarea == 'inicializar'
        run: python seed.py && python sync_liga.py
      - if: steps.t.outputs.tarea == 'sync'
        run: python sync_liga.py
      - if: steps.t.outputs.tarea == 'entreno'
        run: python training.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - if: steps.t.outputs.tarea == 'cargar-partidos'
        run: python load_matches.py && python sync_liga.py
      - if: steps.t.outputs.tarea == 'cargar-clasificacion'
        run: python load_standings.py
      - if: steps.t.outputs.tarea == 'publicar-reglas'
        run: python deploy_rules.py
      - if: steps.t.outputs.tarea == 'ajustes-entreno'
        run: python -c "from common import init; init().collection('config').document('app').set({'trainingTime':'20:00','trainingDeadlineHour':20,'trainingOpenHour':10,'trainingAuto':True}, merge=True); print('Ajustes de entreno guardados')"
      - if: steps.t.outputs.tarea == 'migrar'
        run: python migrate.py
      - if: steps.t.outputs.tarea == 'avisos'
        run: python push_queue.py
      - if: steps.t.outputs.tarea == 'prueba-notificacion'
        run: python test_push.py

      - name: Guardar HTML de la liga (para depurar el lector)
        if: always() && (steps.t.outputs.tarea == 'sync' || steps.t.outputs.tarea == 'inicializar')
        uses: actions/upload-artifact@v4
        with:
          name: html-liga
          path: scripts/debug/
          retention-days: 3
          if-no-files-found: ignore
